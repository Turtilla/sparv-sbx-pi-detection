metadata:
  id: pikorpus
  language: swe
import:
  importer: text_import:parse
  text_annotation: text
export:
  annotations:
    - <sentence>
    - <token>
    - <token>:sbx_pi_detection.pi
sbx_pi_detection:
  annotation_level: sbx/KB-bert-swedish_PI-detection-general
  generative_model: gemma4:latest
  prompt_path: ../testprompt/prompt.txt
  batch_size: 8
